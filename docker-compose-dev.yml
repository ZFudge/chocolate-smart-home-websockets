networks:
  csm-websockets-network-dev:
    name: csm-websockets-network-dev

volumes:
  csm-redis-data-dev:
    driver: local

services:
  csm-redis-dev:
    image: redis:7.4.1-alpine
    container_name: csm-redis-dev
    networks:
      - csm-websockets-network-dev
    ports:
      - 6379:6379
    volumes:
      - csm-redis-data-dev:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  csm-websockets-dev:
    build: .
    image: csm-websockets
    container_name: csm-websockets-dev
    working_dir: /csm-websockets
    networks:
      - csm-websockets-network-dev
    volumes:
      - ./:/csm-websockets/
      - /tmp/csm-logs/:/var/logs/
    command: [
      "uvicorn", "src.ws_app:app",
      "--reload",
      "--reload-dir", "src",
      "--host", "0.0.0.0",
      "--port", "8050",
      "--log-level", "debug",
      "--log-config", "logs.ini"
    ]
    depends_on:
      csm-redis-dev:
        condition: service_healthy
    environment:
      BACKEND_STREAM_NAME: csm-backend-stream-dev
      FRONTEND_STREAM_NAME: csm-frontend-stream-dev
      LOG_SUFFIX: -dev
      REDIS_HOST: csm-redis-dev
      WEBSOCKETS_STREAM_NAME: csm-websockets-stream-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -v -s --max-time=1 ws://localhost:8050/ws 2>&1 | grep 'Operation timed out'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
